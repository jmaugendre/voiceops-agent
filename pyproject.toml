[project]
name = "voiceops-agent"
version = "0.1.0"
description = "Governed voice-to-ERP field-service agent backend for an ElevenLabs portfolio demo"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
